<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>給佳葦</title>
  <!-- 手寫字體（Google Fonts） -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Noto+Serif+TC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>
<body>

<!-- 密碼保護遮罩 -->
<div id="lock">
  <div class="lock-paper">
    <h2>請輸入密碼</h2>
    <input id="pwd" type="password" placeholder="提示：佳葦的正式解脫日 (yy/mm/dd)" />
    <button id="unlock">確定</button>
    <p id="pwd-error">密碼錯誤</p>
  </div>
</div>
  
  <div class="paper">
    <div class="date">2026.04.25</div>

    <h1>Dear You,</h1>

    <p>今天突然很想寫一封信給你。</p>
    <p>不是因為有什麼特別的事情，只是覺得，這樣慢慢寫下來的話，好像比較真實一點。</p>
    <p>如果你看到這裡，希望你今天過得還不錯。</p>

    <div class="signature">From me</div>
  </div>

   <script>
  // =====================
  // BGM
  // =====================
  const audio = document.getElementById("bgm");

  // 設定小聲
  audio.volume = 20;

  // 使用者第一次點擊後播放（避免瀏覽器阻擋）
  function startAudio() {
    audio.play();

    // 淡入效果
    let vol = 0;
    const fade = setInterval(() => {
      if (vol < 0.05) {
        vol += 0.005;
        audio.volume = vol;
      } else {
        clearInterval(fade);
      }
    }, 200);

    document.removeEventListener("click", startAudio);
  }

  document.addEventListener("click", startAudio);
     
  // =====================
  // 🔐 簡易密碼保護（前端）
  // =====================
  const correctPassword = "260430"; // ← 你可以改
  const btn = document.getElementById("unlock");
  const input = document.getElementById("pwd");
  const error = document.getElementById("pwd-error");
  const lock = document.getElementById("lock");
  const audio = document.getElementById("bgm");

  function playMusicWithFade() {
    audio.volume = 0; // 從 0 開始
    audio.play();

    let vol = 0;
    const fade = setInterval(() => {
      if (vol < 0.05) {
        vol += 0.005;
        audio.volume = vol;
      } else {
        clearInterval(fade);
      }
    }, 200);
  }
     
  function unlock() {
    if (input.value === correctPassword) {
      error.style.display = "none";

      // 🎵 在這一刻開始音樂
      playMusicWithFade();
      
      // 加上動畫 class
      lock.classList.add("unlocking");

      // 動畫結束後移除遮罩（避免擋到點擊）
      setTimeout(() => {
        lock.style.display = "none";
      }, 1000);

    } else {
      error.style.display = "block";
    }
  }

  btn.addEventListener("click", unlock);

  // Enter 也可以送出
  input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      unlock();
    }
  });

  pwdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
  </script>

</body>
</html>
