<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>給你的信</title>

  <!-- 手寫字體（Google Fonts） -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Noto+Serif+TC&display=swap" rel="stylesheet">

</head>

<body>

  <div class="paper">
    <div class="date">2026.04.25</div>

    <h1>Dear You,</h1>

    <p>今天突然很想寫一封信給你。</p>
    <p>不是因為有什麼特別的事情，只是覺得，這樣慢慢寫下來的話，好像比較真實一點。</p>
    <p>如果你看到這裡，希望你今天過得還不錯。</p>

    <div class="signature">From me</div>
  </div>

</body>
</html>
