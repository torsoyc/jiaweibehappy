<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>給佳葦</title>
  <!-- 手寫字體（Google Fonts） -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Noto+Serif+TC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>
<body>

  <!-- 密碼保護遮罩 -->
  <div id="lock" style="position:fixed;inset:0;background:#f6f6f6;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;padding:24px 28px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.1);max-width:360px;width:90%;">
  <h2 style="margin-top:0;">輸入密碼</h2>
  <input id="pwd" type="password" placeholder="提示：佳葦的正式解脫日(yy/mm/dd)" style="width:100%;padding:10px;font-size:1em;margin:10px 0;" />
  <button id="unlock" style="width:100%;padding:10px;font-size:1em;">確定</button>
  <p id="pwd-error" style="color:#c00;display:none;margin-top:10px;">密碼錯誤</p>
  </div>
  </div>
  
  <div class="paper">
    <div class="date">2026.04.25</div>

    <h1>Dear You,</h1>

    <p>今天突然很想寫一封信給你。</p>
    <p>不是因為有什麼特別的事情，只是覺得，這樣慢慢寫下來的話，好像比較真實一點。</p>
    <p>如果你看到這裡，希望你今天過得還不錯。</p>

    <div class="signature">From me</div>
  </div>

   <script>
  // =====================
  // BGM
  // =====================
  const audio = document.getElementById("bgm");

  // 設定小聲
  audio.volume = 0.5;

  // 使用者第一次點擊後播放（避免瀏覽器阻擋）
  function startAudio() {
    audio.play();

    // 淡入效果
    let vol = 0;
    const fade = setInterval(() => {
      if (vol < 0.05) {
        vol += 0.005;
        audio.volume = vol;
      } else {
        clearInterval(fade);
      }
    }, 200);

    document.removeEventListener("click", startAudio);
  }

  document.addEventListener("click", startAudio);
     
  // =====================
  // 🔐 簡易密碼保護（前端）
  // =====================
  const SITE_PASSWORD = '260430'; // ⚠️ 前端密碼僅為簡易保護
  const lock = document.getElementById('lock');
  const pwdInput = document.getElementById('pwd');
  const unlockBtn = document.getElementById('unlock');
  const pwdError = document.getElementById('pwd-error');

  function tryUnlock() {
    if (pwdInput.value === SITE_PASSWORD) {
      // 不再記錄解鎖狀態，每次重新整理都需要重新輸入
      lock.style.display = 'none';
      pwdError.style.display = 'none';
    } else {
      pwdError.style.display = 'block';
    }
  }

  // 每次重新整理都重新上鎖，不自動解鎖
  unlockBtn.addEventListener('click', tryUnlock);
  pwdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
  </script>

</body>
</html>
